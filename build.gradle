plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.fabriccarbot'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.fabricmc.net/repository/maven-public/' }
    maven { url = 'https://masa.dy.fi/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"
    implementation "net.fabricmc.fabric-api:fabric-api:0.167.0+26.3"
    implementation "carpet:fabric-carpet:26.3+v261008"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}